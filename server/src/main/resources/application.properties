server.port=${API_PORT:4000}
spring.application.name=authmatrix-server

# Allow cross-origin requests
spring.mvc.cors.mapping-path-pattern=/api/**
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# SQLite database configuration
authmatrix.db-path=${DB_PATH:authmatrix.db}

# Logging
logging.level.com.authmatrix=INFO
